# ──────────────────────────────────────────────
# CareerCraft AI — application.properties
# ──────────────────────────────────────────────

spring.application.name=CareerCraft AI

# ── Active profile ──
spring.profiles.active=dev

# ── Server ──
server.port=8085

# ── Dev profile: Persistent H2 Database (saved to ./data/careercraft) ──
spring.datasource.url=jdbc:h2:file:./data/careercraft;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── Jackson ──
spring.jackson.default-property-inclusion=non_null

# ── Session & Cookie Persistence ──
server.servlet.session.timeout=7d
server.servlet.session.cookie.name=CAREERCRAFT_SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ── Gemini API ──
gemini.api.key=
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# ── ML service (FastAPI) ──
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
