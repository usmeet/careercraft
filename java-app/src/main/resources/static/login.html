<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In to CareerCraft AI</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;600&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav__logo">
      <span class="nav__logo-mark">CC</span>
      CareerCraft AI
    </a>
    <div class="nav__links">
      <a href="index.html" class="nav__link">Home</a>
      <a href="try.html" class="nav__link">Try It</a>
      <a href="how-it-works.html" class="nav__link">How It Works</a>
    </div>
    <div class="nav__right">
      <a href="login.html" class="nav__login-link">Log in</a>
      <a href="signup.html" class="btn-nav-white">Create account</a>
      <button class="nav__toggle" aria-expanded="false" aria-label="Toggle menu">&#x2630;</button>
    </div>
  </nav>

  <main class="auth-page band-canvas">
    <div class="card auth-card reveal" style="padding: var(--spacing-32);">
      <h1>Welcome back</h1>
      <p class="auth-card__subtitle">Log in to keep using the tools and see your saved history.</p>
      
      <div id="auth-error" class="field__error" style="text-align:center;min-height:20px;"></div>
      <form id="login-form" class="auth-form" action="#" method="POST">
        <div class="field">
          <label class="field__label" for="email">Email</label>
          <input type="email" id="email" name="email" class="field__input" required>
        </div>
        <div class="field">
          <label class="field__label" for="password">Password</label>
          <input type="password" id="password" name="password" class="field__input" required>
        </div>
        <button type="submit" class="btn-primary">Log in</button>
      </form>
      
      <div class="auth-footer">
        New here? <a href="signup.html">Create a free account</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <div class="footer__links">
        <a href="index.html" class="footer__link">Home</a>
        <a href="try.html" class="footer__link">Try It</a>
        <a href="how-it-works.html" class="footer__link">How It Works</a>
        <a href="about.html" class="footer__link">About</a>
      </div>
      <p class="footer__copy">© 2026 CareerCraft AI</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
