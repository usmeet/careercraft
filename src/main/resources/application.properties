# ──────────────────────────────────────────────
# CareerCraft AI — application.properties
# ──────────────────────────────────────────────

spring.application.name=CareerCraft AI

# ── Active profile ──
# Use "dev" locally (H2 in-memory), "prod" for MySQL deployment.
spring.profiles.active=dev

# ── Server ──
server.port=8085

# ── Dev profile: H2 in-memory database ──
spring.datasource.url=jdbc:h2:mem:careercraft
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ── Jackson ──
spring.jackson.default-property-inclusion=non_null

# ── Session ──
server.servlet.session.timeout=30m

# ── Gemini API ──
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
